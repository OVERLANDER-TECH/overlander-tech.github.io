<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} — {{ site.title }}</title>

  <!-- MathJax 3 — renders LaTeX notation ($...$, $$...$$, \[...\], \(...\)) -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath:  [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        tags: 'ams'
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #1a1a2e;
      --card:      #16213e;
      --accent:    #0f3460;
      --highlight: #e94560;
      --text:      #e0e0e0;
      --muted:     #8892a4;
      --border:    rgba(233, 69, 96, 0.25);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.75;
      min-height: 100vh;
    }

    /* ── HEADER ─────────────────────────────────── */
    .post-header {
      background: linear-gradient(135deg, var(--accent) 0%, #1a1a2e 60%);
      border-bottom: 2px solid var(--highlight);
      padding: 2.5rem 2rem 2rem;
      text-align: center;
    }

    .post-header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      max-width: 800px;
      margin: 0 auto 0.5rem;
    }

    .post-header .meta {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .post-header .meta a {
      color: var(--highlight);
      text-decoration: none;
    }

    .post-header .meta a:hover { text-decoration: underline; }

    /* ── CONTENT ────────────────────────────────── */
    .post-content {
      max-width: 820px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    .post-content h2 {
      font-size: 1.5rem;
      color: #fff;
      margin: 2.5rem 0 1rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
    }

    .post-content h3 {
      font-size: 1.2rem;
      color: #fff;
      margin: 2rem 0 0.8rem;
    }

    .post-content h4 {
      font-size: 1.05rem;
      color: var(--highlight);
      margin: 1.5rem 0 0.6rem;
    }

    .post-content p {
      margin-bottom: 1rem;
    }

    .post-content blockquote {
      border-left: 3px solid var(--highlight);
      background: var(--card);
      padding: 1rem 1.25rem;
      margin: 1.5rem 0;
      border-radius: 0 8px 8px 0;
      color: var(--muted);
    }

    .post-content blockquote strong { color: var(--text); }

    .post-content em { color: #c0c0d0; }

    .post-content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 2rem 0;
    }

    .post-content ul, .post-content ol {
      padding-left: 1.5rem;
      margin-bottom: 1rem;
    }

    .post-content li { margin-bottom: 0.4rem; }

    .post-content code {
      background: var(--card);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-size: 0.9em;
      color: var(--highlight);
    }

    .post-content pre {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.2rem;
      overflow-x: auto;
      margin: 1.5rem 0;
    }

    .post-content pre code {
      background: none;
      padding: 0;
      color: var(--text);
    }

    /* MathJax display equations */
    .MathJax { color: var(--text) !important; }
    mjx-container[jax="SVG"][display="true"] {
      margin: 1.5rem 0 !important;
    }

    /* ── FOOTER ─────────────────────────────────── */
    .post-footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 2rem 1rem;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .post-footer a {
      color: var(--highlight);
      text-decoration: none;
    }

    .post-footer a:hover { text-decoration: underline; }

    .back-link {
      display: inline-block;
      margin-bottom: 1rem;
      font-size: 0.85rem;
      color: var(--highlight);
      text-decoration: none;
      font-weight: 600;
    }

    .back-link:hover { text-decoration: underline; }
    .back-link::before { content: '← '; }

    /* ── RESPONSIVE ─────────────────────────────── */
    @media (max-width: 600px) {
      .post-header { padding: 1.5rem 1rem; }
      .post-header h1 { font-size: 1.4rem; }
      .post-content { padding: 1.5rem 1rem 3rem; }
    }
  </style>
</head>
<body>

  <div class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="meta">
      {{ page.date | date: "%B %d, %Y" }}
      · <a href="{{ '/' | relative_url }}">Overlander Tech</a>
    </div>
  </div>

  <div class="post-content">
    <a class="back-link" href="{{ '/' | relative_url }}">Back to Home</a>
    {{ content }}
  </div>

  <footer class="post-footer">
    <p>Overlander Tech &copy; {{ site.time | date: "%Y" }} · Built with <a href="https://jekyllrb.com">Jekyll</a> · Hosted on <a href="https://pages.github.com">GitHub Pages</a></p>
  </footer>

</body>
</html>
